<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body class="bg-img ">
    <header>
        
    </header>
    <main>
        <div class="container  ">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card shadow-lg p-4 rounded-4">
                        <div>
            <h1 class="mb-4 text-center">Search for a rental car</h1>
        </div>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Pick up location</label>
                                <input type="text" class="form-control" placeholder="City, airport, region, district...">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="deliverElse">
                                    <label class="form-check-label" for="deliverElse">Deliver the car somewhere else</label>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Date of pickup</label>
                                    <input type="date" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Date of delivery</label>
                                    <input type="date" class="form-control">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label"></label>
                                    <input type="time" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label"></label>
                                    <input type="time" class="form-control">
                                </div>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="driverAge" checked>
                                <label class="form-check-label" for="driverAge">The driver’s age between 30 and 65?</label>
                            </div>
                            <ul class="list-unstyled mb-3">
                                <li>✓ No credit card fees</li>
                                <li>✓ No change fees</li>
                                <li>✓ Price match guarantee</li>
                            </ul>
                            <button type="submit" class="btn btn-danger w-100">Search</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
